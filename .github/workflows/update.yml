name: StockPulse 데이터 자동 갱신

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 실제 데이터 수집 + 사이트 재생성
        working-directory: scripts
        env:
          SITE_OUT_DIR: ${{ github.workspace }}
        run: |
          python fetch_universe.py
          python fetch_market.py
          python fetch_etfs.py
          python build_unified_site.py

      - name: 변경사항 커밋 및 배포
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "자동 데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
